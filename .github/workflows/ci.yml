name: CI

on:
  # Branch pushes are covered by their pull request; push runs only for main
  # (it gates the deploy), so a PR branch isn't tested twice per push.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR supersedes a running check. Never cancel
# on main: a cancelled run there would skip that commit's deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-lint:
    name: Backend - lint & API schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ty + ruff + import-linter)
        run: uv run poe check

      - name: API schemas match the code
        run: uv run poe openapi && git diff --exit-code openapi.json openapi.internal.json

  # The full app and the app without the optional modules, side by side. The
  # foundation and the product must work without them: the "without-modules"
  # leg removes them from its throwaway checkout for good (as a user would,
  # docs/adding-a-domain-module.md) and checks everything again - lint, the
  # migration chain on a fresh database, and the remaining tests. Each leg
  # runs its tests in parallel across the runner's cores (pytest -n auto).
  backend-test:
    name: Backend - test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, without-modules]
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_SECRET: ci-test-secret-not-for-production
      DB_CONNECTION: postgresql+psycopg://postgres:postgres@localhost:5432/app

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Remove the optional modules
        if: matrix.variant == 'without-modules'
        run: |
          uv run python scripts/remove_module.py billing
          uv run python scripts/remove_module.py marketing
          uv run poe fix
          uv run poe check

      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

      - name: Test
        run: uv run poe test

  # The app with and without the billing module, side by side: the
  # "without-billing" leg removes it from its throwaway checkout (as a user
  # would) and checks everything again.
  frontend:
    name: Frontend - check & test (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, without-billing]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types match the schema
        if: matrix.variant == 'full'
        run: npm run gen:api && git diff --exit-code src/api-schema.ts

      - name: Formatting
        if: matrix.variant == 'full'
        run: npm run format:check

      - name: Remove the billing module
        if: matrix.variant == 'without-billing'
        run: node scripts/remove-billing.mjs

      # Before type-checking: the build generates the route, component and
      # auto-import types (src/*.d.ts, gitignored) that the type-check reads.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      # Not `npm run lint`: that runs eslint --fix, which would pass by
      # rewriting the checkout instead of failing.
      - name: Lint
        run: npx eslint .

      - name: Component tests
        run: npm test

  site:
    name: Site - check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  # The production images build (base images, the --no-dev install on slim,
  # npm ci on Alpine, COPY/.dockerignore) and start up, without pushing
  # anything or needing secrets. Built in parallel, layers cached between runs.
  images:
    name: Image - ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The app imports with only the production dependencies installed.
          - image: backend
            smoke: python -c "import src.main"
          # Caddy accepts the config the image ships.
          - image: frontend
            smoke: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          - image: site
            smoke: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.image }}
          load: true
          tags: ci/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test ${{ matrix.image }}
        run: docker run --rm ci/${{ matrix.image }}:${{ github.sha }} ${{ matrix.smoke }}

