[project]
name = "saas-boilerplate"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.137.1",
    "alembic>=1.18.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.49.0",
    "psycopg-binary>=3.3.4",
    "psycopg>=3.3.4",
    "python-dateutil>=2.9.0.post0",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "slowapi>=0.1.9",
    "stripe>=15.2.1",
    "disposable-email-domains>=0.0.204",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "import-linter>=2.11",
    "locust>=2.44.1",
    "poethepoet>=0.46.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]

[tool.poe.tasks]
lint = "bash -c 'ty check src tests && ruff check src tests && ruff format src tests --check && lint-imports'"
format = "bash -c 'ruff check src tests --fix && ruff format src tests'"
test = "pytest ./tests -n auto"
test-cov = "pytest ./tests -n auto --cov=src --cov-report=term-missing --cov-report=html:htmlcov"
dev = "fastapi dev src/main.py --host 0.0.0.0 --port 8000"
openapi = "python generate_openapi.py"

[tool.ruff]
exclude = ["src/platform/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ASYNC", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
exclude = ["src/platform/templates"]

[tool.coverage.run]
source = ["src"]
omit = ["src/platform/templates/*"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Platform must not import the product domain"
type = "forbidden"
source_modules = ["src.platform"]
forbidden_modules = ["src.example"]

# Each layer may import the layers below it, never the ones above. Applied to
# both the platform and the product package; `billing` (the payment provider
# adapter) only exists in the platform. Keep `src.example` pointed at your
# product package when you rename it.
[[tool.importlinter.contracts]]
name = "Layers: routers > services > billing > repositories > models | schemas"
type = "layers"
containers = ["src.platform", "src.example"]
layers = [
    "routers",
    "services",
    "(billing)",
    "repositories",
    "models | schemas",
]

[[tool.importlinter.contracts]]
name = "Routers reach data only through services"
type = "forbidden"
source_modules = ["src.platform.routers", "src.example.routers"]
forbidden_modules = [
    "src.platform.repositories",
    "src.platform.models",
    "src.example.repositories",
    "src.example.models",
]
# Routers -> services -> repositories is the intended path; only direct
# imports are forbidden.
allow_indirect_imports = true

# `core` is the foundation every layer builds on (config, database, errors,
# logging, telemetry, hooks), so it must not import any of them.
[[tool.importlinter.contracts]]
name = "Core does not import the layers built on it"
type = "forbidden"
source_modules = ["src.platform.core"]
forbidden_modules = [
    "src.platform.routers",
    "src.platform.services",
    "src.platform.billing",
    "src.platform.repositories",
    "src.platform.models",
    "src.platform.schemas",
]
