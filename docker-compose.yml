services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_UMAMI_USER: ${DB_UMAMI_USER}
      DB_UMAMI_PASSWORD: ${DB_UMAMI_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/db-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in BACKEND_ENV}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in BACKEND_ENV}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      DB_CONNECTION: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "10"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s

  worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      DB_CONNECTION: postgresql+psycopg://${DB_USER}:${DB_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${DB_NAME}
    command: uv run python worker.py
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "10"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8000
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:-}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: [analytics]
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${DB_UMAMI_USER}:${DB_UMAMI_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.19.2
    profiles: [observability]
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      OBSERVABILITY_HOST: ${OBSERVABILITY_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${FARO_PORT:-12347}:12347"
    volumes:
      - ./observability/alloy/agent.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data

volumes:
  alloy_data:
  pgadmin_data:
  postgres_data:
