services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_UMAMI_USER: ${DB_UMAMI_USER}
      DB_UMAMI_PASSWORD: ${DB_UMAMI_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/db-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 5s

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ./backend.env
    ports:
      - "8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "10"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s

  worker:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    env_file: ./backend.env
    command: uv run python worker.py
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "10"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    environment:
      API_TARGET: http://backend:8000
      ANALYTICS_ORIGIN: ${ANALYTICS_ORIGIN:-https://analytics.example.com}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${DB_UMAMI_USER}:${DB_UMAMI_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
