repos:
  - repo: local
    hooks:
      # Backend checks run through the poe tasks, so they cover the same paths as CI.
      - id: backend-fix
        name: ruff fix + format
        entry: uv run --directory backend poe fix
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: backend-types
        name: ty
        entry: uv run --directory backend poe check:types
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: backend-imports
        name: import-linter contracts
        entry: uv run --directory backend poe check:imports
        language: system
        files: ^backend/(.*\.py|pyproject\.toml)$
        pass_filenames: false

      # Schemas and the frontend's API types, regenerated together so a commit
      # that changes the API carries everything CI checks.
      - id: generate-openapi
        name: generate openapi + API types
        entry: bash -c 'cd backend && uv run python generate_openapi.py && cd ../frontend && npm run gen:api --silent && cd .. && git add backend/openapi.json backend/openapi.internal.json frontend/src/api-schema.ts'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|vue|js|css)$
        pass_filenames: true

      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npx eslint --fix "${@#frontend/}"' --
        language: system
        files: ^frontend/src/.*\.(ts|vue|js)$
        pass_filenames: true
