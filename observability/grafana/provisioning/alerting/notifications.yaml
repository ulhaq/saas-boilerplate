# Where alerts go: email to ALERT_EMAIL via Grafana's SMTP settings
# (GF_SMTP_* in docker-compose.observability.yml).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email
    receivers:
      - uid: email-ops
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
